# Render Blueprint for SmartHire Finance
#
# Creates TWO resources:
#   1. A managed PostgreSQL database that holds all candidate and manager data.
#   2. One web service serving both portals at the same URL:
#        - Candidate portal:  /            (open to anyone with the link)
#        - Manager portal:    "Manager Intelligence Portal" tab (email + password)
#
# Why Postgres and not SQLite: the web service filesystem is EPHEMERAL — it is wiped on
# every restart, redeploy and wake-from-sleep. A SQLite file living there would lose all
# candidate records. The database below is a separate, durable resource, so the data
# survives independently of the app container.
#
# NOTE ON PLANS: Render's free PostgreSQL instance expires after a limited trial period,
# after which it is removed. For anything long-lived either upgrade the database plan, or
# host Postgres elsewhere for free (Neon / Supabase) and set DATABASE_URL manually — see
# DEPLOY.md. Everything else in this file stays the same.

databases:
  - name: smarthire-db
    databaseName: smarthire
    user: smarthire
    plan: free
    region: singapore      # must match the web service region

services:
  - type: web
    name: smarthire-finance
    runtime: python
    plan: free             # free web service sleeps when idle; first request then takes ~30-60s
    region: singapore      # closest Render region to India; change if you prefer
    branch: main
    buildCommand: pip install -r requirements.txt
    # Single worker: the adaptive engine and scoring are per-request and the app is
    # low-traffic, so one process keeps behaviour simple and predictable.
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"

      # Connection string for the database above, injected by Render. The app rewrites
      # the postgres:// prefix and adds sslmode=require automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: smarthire-db
          property: connectionString

      # Signs manager session tokens. Generated once by Render and then held stable, so
      # managers are not logged out on every deploy.
      - key: SECRET_KEY
        generateValue: true

      # Credentials for the first administrator account, created on first boot.
      # Set both in the Render dashboard; change the password after signing in.
      - key: MANAGER_EMAIL
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
